<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ミテハカール">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>JWWミテハカール</title>
<link rel="stylesheet" href="./src/style.css">
<script>
  // ホーム画面から開いたとき（スタンドアロン）だけ、画面の高さを 100vh で決める（style.css 参照）。
  // 描き始める前に決めておきたいので、最初に読み込まれるこの場所で印を付ける
  if (navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
    document.documentElement.classList.add('standalone');
  }
  // iOS アプリ（Capacitor）でも、ブラウザのバーがないのでホーム画面から開いたときと同じ決め方にする
  if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
    document.documentElement.classList.add('standalone', 'native');
  }
  // 横向きでツールバーを縦に並べる側（縦向きで下だった側）。main.ts の railSide と同じ決め方で、
  // 描き始める前に決めておく（端末を左に回すと右、右に回すと左）
  (function () {
    var o = window.orientation;
    var a = typeof o === 'number' ? o : (window.screen && screen.orientation ? screen.orientation.angle : 0);
    document.documentElement.dataset.rail = a === -90 || a === 270 ? 'left' : 'right';
  })();
</script>
</head>
<body>
<!-- 左右の安全領域を JavaScript から読むための見えない要素（余白に env() の値が入る） -->
<div id="safe-probe" aria-hidden="true"></div>
<!-- アイコンは一度だけ定義して <use> で使い回す -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-measure" viewBox="0 0 24 24"><path d="M3.5 16.5 16.5 3.5l4 4-13 13z"/><path d="m7.6 12.4 1.9 1.9M10.6 9.4l1.9 1.9M13.6 6.4l1.9 1.9"/></symbol>
    <symbol id="i-inspect" viewBox="0 0 24 24"><path d="M3.5 11.5V3.5h8l9 9-8 8z"/><circle cx="7.8" cy="7.8" r="1.4"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5 3 8.5l9 5 9-5z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 16.5 9 5 9-5"/></symbol>
    <symbol id="i-display" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-ortho" viewBox="0 0 24 24"><path d="M5 4v15h15"/><path d="M5 13.5h5.5V19"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 6 4 11l5 5"/><path d="M4 11h10.5a5 5 0 0 1 0 10H12"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.2 7l.9 13h9.8l.9-13"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M5 12.5A7 7 0 1 0 12 5.5H7"/><path d="M9.5 2.5 6.5 5.5l3 3"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="M19 12.5A7 7 0 1 1 12 5.5h5"/><path d="m14.5 2.5 3 3-3 3"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-6.5 6.5M10 20H4v-6M4 20l6.5-6.5"/></symbol>
    <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M20 10h-6V4M14 10l6.5-6.5M4 14h6v6M10 14l-6.5 6.5"/></symbol>
  </defs>
</svg>

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="text"></canvas>
  <canvas id="overlay"></canvas>
</div>

<!-- 画面の枠。ホーム画面から開いたときは高さを 100vh にした固定レイヤーで、下端を本当の画面の下端に合わせる -->
<div id="shell">
<div id="topbar">
  <button id="btn-open" class="chip" aria-haspopup="true" aria-expanded="false">ファイル</button>
  <div id="title" class="title">図面を開いてください</div>
  <!-- ボタンやパネルを隠して、図面を画面いっぱいに見る -->
  <button id="btn-ui-hide" class="chip icon ui-toggle" aria-label="ボタンを隠して図面を広く見る"><svg class="ico"><use href="#i-expand"/></svg></button>
  <button id="btn-info" class="chip icon" aria-label="図面情報">i</button>
</div>

<!-- ボタンを隠しているあいだだけ出す、元に戻すボタン -->
<button id="btn-ui-show" class="ui-show" aria-label="ボタンを出す"><svg class="ico"><use href="#i-shrink"/></svg></button>

<!-- 計測中の結果と操作 -->
<!--
  図面を広く見せたいので、点がないときは操作の 1 段だけ、測っているときはその上に値の段を足す。
  操作の段（縮尺・直交・色・距離／面積／体積）は常に同じ位置にあり、点を置いたり消したりしても動かない。
  戻す・消去は値の段の右端に置き、縮尺（操作の段の左端）から離す
-->
<section id="readout" class="panel readout idle hidden" aria-label="計測">
  <!-- 色の選択。操作の段の上に浮かべる（パネルの高さは変えない） -->
  <div id="color-pop" class="color-pop hidden" role="group" aria-label="計測の色"></div>
  <div class="readout-top">
    <span id="readout-value" class="readout-value">—</span>
    <div id="readout-detail" class="detail"></div>
    <button id="btn-undo" class="icon-btn" aria-label="1 点戻す"><svg class="ico"><use href="#i-undo"/></svg></button>
    <button id="btn-clear" class="icon-btn" aria-label="すべて消去"><svg class="ico"><use href="#i-clear"/></svg></button>
  </div>
  <div class="readout-bar">
    <button id="btn-scale" class="chip small" aria-label="計測に使う縮尺">1/—</button>
    <button id="btn-ortho" class="pill on" aria-pressed="true" aria-label="水平・垂直に拘束"><svg class="ico"><use href="#i-ortho"/></svg><span class="label">直交</span></button>
    <button id="btn-color" class="icon-btn color-btn" aria-label="計測の色" aria-haspopup="true" aria-expanded="false"><span class="color-dot"></span></button>
    <div id="seg-mode" class="segmented mode-seg" role="group" aria-label="計測の種類">
      <button data-mode="length" aria-pressed="true" class="on">距離</button>
      <button data-mode="area" aria-pressed="false">面積</button>
      <button data-mode="volume" aria-pressed="false">体積</button>
      <button data-mode="angle" aria-pressed="false">角度</button>
    </div>
  </div>
</section>

<!-- 体積の高さを入れる。キーボードに隠れないよう画面の上の方に出す -->
<div id="height-dialog" class="dialog-wrap hidden">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="height-title">
    <div id="height-title" class="dialog-title">体積の高さ</div>
    <div class="sub">囲んだ面積に掛ける高さ（実寸）</div>
    <label class="dialog-input">
      <input id="height-input" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="高さ（mm）">
      <span>mm</span>
    </label>
    <div id="height-error" class="dialog-error"></div>
    <div class="dialog-actions">
      <button id="btn-height-cancel" class="pill">やめる</button>
      <button id="btn-height-ok" class="pill on">決定</button>
    </div>
  </div>
</div>

<!-- タップした図形の属性 -->
<!--
  操作ボタンは常に同じ 3 つを同じ位置に置く（図形を選んでいないときは押せないだけ）。
  戻る・進むは見出しの行に置き、押したボタンの下へ別のボタンが来ないようにする
-->
<section id="inspect-panel" class="panel hidden" aria-label="属性">
  <!-- つまみ：見出しを下へずらすと見出しだけに縮み、上へずらすか押すと戻る -->
  <div class="grab" aria-hidden="true"></div>
  <div class="panel-top">
    <span id="inspect-kind" class="inspect-kind">属性</span>
    <span class="panel-top-end">
      <span id="inspect-tag" class="tag hidden"></span>
      <button id="btn-layer-undo" class="icon-btn head-btn" aria-label="表示を 1 つ前に戻す" disabled><svg class="ico"><use href="#i-back"/></svg></button>
      <button id="btn-layer-redo" class="icon-btn head-btn" aria-label="戻した表示をやり直す" disabled><svg class="ico"><use href="#i-forward"/></svg></button>
    </span>
  </div>
  <div id="inspect-body" class="inspect-body"></div>
  <div id="inspect-actions" class="panel-actions">
    <button id="btn-layer-only" class="pill" disabled>レイヤだけ表示</button>
    <button id="btn-layer-hide" class="pill" disabled>レイヤを隠す</button>
    <button id="btn-layer-invert" class="pill">表示を反転</button>
  </div>
</section>

<nav id="toolbar" aria-label="ツール">
  <button id="btn-tool-measure" class="tool on" aria-pressed="true"><svg class="ico"><use href="#i-measure"/></svg><span>計測</span></button>
  <button id="btn-tool-inspect" class="tool" aria-pressed="false"><svg class="ico"><use href="#i-inspect"/></svg><span>属性</span></button>
  <button id="btn-layers" class="tool"><svg class="ico"><use href="#i-layers"/></svg><span>レイヤ</span></button>
  <button id="btn-display" class="tool"><svg class="ico"><use href="#i-display"/></svg><span>表示</span></button>
  <!-- 「全体」を押すと「前の範囲」に変わり、押す前の範囲に戻せる -->
  <button id="btn-fit" class="tool" aria-label="全体を表示"><svg class="ico"><use href="#i-fit"/></svg><span>全体</span></button>
</nav>

<div id="hint" class="hint hidden"></div>

<div id="loading" class="overlay-panel hidden">
  <div class="spinner"></div>
  <div id="loading-text">読み込み中…</div>
</div>

<div id="info-panel" class="overlay-panel sheet hidden">
  <div class="sheet-head">
    <strong>図面情報</strong>
    <button id="btn-info-close" class="chip">閉じる</button>
  </div>
  <div id="info-body" class="sheet-body"></div>
</div>

<!-- 図面を開く：最近開いた図面の一覧と、ファイルから選ぶボタン -->
<div id="files-panel" class="overlay-panel sheet hidden">
  <div class="sheet-head">
    <strong>図面を開く</strong>
    <button id="btn-files-close" class="chip">閉じる</button>
  </div>
  <div class="sheet-body">
    <button id="btn-pick-file" class="primary">ファイルから選ぶ</button>
    <div class="recent-caption sub">最近開いた図面</div>
    <div id="recent-list" class="recent-list"></div>
  </div>
</div>

<div id="layer-panel" class="overlay-panel sheet hidden">
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <strong>レイヤ</strong>
    <!-- 戻る・進むは属性の見出しのものと同じ履歴を行き来する -->
    <span class="sheet-head-end">
      <button id="btn-layer-list-undo" class="icon-btn head-btn" aria-label="表示を 1 つ前に戻す" disabled><svg class="ico"><use href="#i-back"/></svg></button>
      <button id="btn-layer-list-redo" class="icon-btn head-btn" aria-label="戻した表示をやり直す" disabled><svg class="ico"><use href="#i-forward"/></svg></button>
      <button id="btn-layer-close" class="chip">閉じる</button>
    </span>
  </div>
  <div class="sheet-body">
    <div class="sheet-toolbar">
      <div id="layer-summary" class="sub"></div>
      <div class="section-actions">
        <button id="btn-layer-jw" class="chip small">Jw_cad の状態</button>
        <button id="btn-layer-all" class="chip small">すべて表示</button>
        <button id="btn-layer-invert-all" class="chip small">反転</button>
      </div>
    </div>
    <div id="layer-list" class="layer-list"></div>
  </div>
</div>

<div id="display-panel" class="overlay-panel sheet hidden">
  <div class="sheet-head">
    <strong>表示</strong>
    <button id="btn-display-close" class="chip">閉じる</button>
  </div>
  <div class="sheet-body">
    <div class="setting-row">
      <span class="setting-label">背景</span>
      <div id="seg-bg" class="segmented" role="group" aria-label="背景">
        <button data-value="dark">黒</button>
        <button data-value="light">白</button>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">線の色</span>
      <div id="seg-mono" class="segmented" role="group" aria-label="線の色">
        <button data-value="color">色分け</button>
        <button data-value="mono">単色</button>
      </div>
    </div>

    <div class="section-head">
      <div>
        <div class="section-title">色ごとの表示</div>
        <div id="color-summary" class="sub"></div>
      </div>
      <div class="section-actions">
        <button id="btn-color-all" class="chip small">すべて表示</button>
        <button id="btn-color-none" class="chip small">すべて隠す</button>
      </div>
    </div>
    <div id="color-list" class="color-list"></div>
  </div>
</div>

<!-- 最初は隠しておき、前回の図面も渡された図面もないときに出す（前回の図面を開くときに一瞬見えないように） -->
<div id="welcome" class="overlay-panel sheet hidden">
  <div class="sheet-body welcome-body">
    <h1>JWWミテハカール</h1>
    <p>Jw_cad の図面（.jww）をそのまま開いて、実寸で長さを測れます。</p>
    <button id="btn-open-2" class="primary">図面を開く</button>
    <ul class="tips">
      <li>1 本指でスクロール、2 本指で拡大縮小</li>
      <li>「計測」ではタップで計測点を置きます。長押しで拡大鏡、置いた点はつまんで動かせます</li>
      <li>「属性」では図形をタップすると、レイヤ・線色・線種・長さが分かります</li>
      <li>「レイヤ」でレイヤごとに表示を切り替えられます。最初は Jw_cad と同じ表示です</li>
    </ul>
  </div>
</div>
</div>

<input id="file" type="file" hidden>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
