<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JWW Viewer">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>JWW ビューア</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<!-- アイコンは一度だけ定義して <use> で使い回す -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-measure" viewBox="0 0 24 24"><path d="M3.5 16.5 16.5 3.5l4 4-13 13z"/><path d="m7.6 12.4 1.9 1.9M10.6 9.4l1.9 1.9M13.6 6.4l1.9 1.9"/></symbol>
    <symbol id="i-inspect" viewBox="0 0 24 24"><path d="M3.5 11.5V3.5h8l9 9-8 8z"/><circle cx="7.8" cy="7.8" r="1.4"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3.5 3 8.5l9 5 9-5z"/><path d="m3 12.5 9 5 9-5"/><path d="m3 16.5 9 5 9-5"/></symbol>
    <symbol id="i-display" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
    <symbol id="i-ortho" viewBox="0 0 24 24"><path d="M5 4v15h15"/><path d="M5 13.5h5.5V19"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 6 4 11l5 5"/><path d="M4 11h10.5a5 5 0 0 1 0 10H12"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.2 7l.9 13h9.8l.9-13"/></symbol>
  </defs>
</svg>

<div id="safe-probe" aria-hidden="true"></div>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="text"></canvas>
  <canvas id="overlay"></canvas>
</div>

<div id="topbar">
  <button id="btn-open" class="chip">ファイル</button>
  <div id="title" class="title">図面を開いてください</div>
  <button id="btn-info" class="chip icon" aria-label="図面情報">i</button>
</div>

<!-- 計測中の結果と操作 -->
<!--
  図面を広く見せたいので、点がないときは操作の 1 段だけ、測っているときはその上に長さの段を足す。
  操作の段は常に同じ位置にあり、点を置いたり消したりしてもボタンが指の下へ動いてこない。
  縮尺のボタンは左端、消去は右端に置いて、押し間違えないように離す
-->
<section id="readout" class="panel readout idle hidden" aria-label="計測">
  <div class="readout-top">
    <span id="readout-value" class="readout-value">—</span>
    <div id="readout-detail" class="detail"></div>
  </div>
  <div class="readout-bar">
    <button id="btn-scale" class="chip small" aria-label="計測に使う縮尺">1/—</button>
    <button id="btn-ortho" class="pill on" aria-pressed="true" aria-label="水平・垂直に拘束"><svg class="ico"><use href="#i-ortho"/></svg><span class="label">直交</span></button>
    <div id="readout-hint" class="detail readout-hint">タップで計測、長押しで拡大鏡</div>
    <button id="btn-undo" class="icon-btn" aria-label="1 点戻す"><svg class="ico"><use href="#i-undo"/></svg></button>
    <button id="btn-clear" class="icon-btn" aria-label="すべて消去"><svg class="ico"><use href="#i-clear"/></svg></button>
  </div>
</section>

<!-- タップした図形の属性 -->
<!--
  操作ボタンは常に同じ 3 つを同じ位置に置く（図形を選んでいないときは押せないだけ）。
  「元に戻す」は見出しの行に出して、押したボタンの下へ別のボタンが来ないようにする
-->
<section id="inspect-panel" class="panel hidden" aria-label="属性">
  <div class="panel-top">
    <span id="inspect-kind" class="inspect-kind">属性</span>
    <span class="panel-top-end">
      <span id="inspect-tag" class="tag hidden"></span>
      <button id="btn-layer-back" class="chip small hidden"><svg class="ico small-ico"><use href="#i-undo"/></svg>元に戻す</button>
    </span>
  </div>
  <div id="inspect-body" class="inspect-body"></div>
  <div id="inspect-actions" class="panel-actions">
    <button id="btn-layer-only" class="pill" disabled>レイヤだけ表示</button>
    <button id="btn-layer-hide" class="pill" disabled>レイヤを隠す</button>
    <button id="btn-layer-invert" class="pill">表示を反転</button>
  </div>
</section>

<nav id="toolbar" aria-label="ツール">
  <button id="btn-tool-measure" class="tool on" aria-pressed="true"><svg class="ico"><use href="#i-measure"/></svg><span>計測</span></button>
  <button id="btn-tool-inspect" class="tool" aria-pressed="false"><svg class="ico"><use href="#i-inspect"/></svg><span>属性</span></button>
  <button id="btn-layers" class="tool"><svg class="ico"><use href="#i-layers"/></svg><span>レイヤ</span></button>
  <button id="btn-display" class="tool"><svg class="ico"><use href="#i-display"/></svg><span>表示</span></button>
  <button id="btn-fit" class="tool"><svg class="ico"><use href="#i-fit"/></svg><span>全体</span></button>
</nav>

<div id="hint" class="hint hidden"></div>

<div id="loading" class="overlay-panel hidden">
  <div class="spinner"></div>
  <div id="loading-text">読み込み中…</div>
</div>

<div id="info-panel" class="overlay-panel sheet hidden">
  <div class="sheet-head">
    <strong>図面情報</strong>
    <button id="btn-info-close" class="chip">閉じる</button>
  </div>
  <div id="info-body" class="sheet-body"></div>
</div>

<div id="layer-panel" class="overlay-panel sheet hidden">
  <div class="sheet-head">
    <strong>レイヤ</strong>
    <button id="btn-layer-close" class="chip">閉じる</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-toolbar">
      <div id="layer-summary" class="sub"></div>
      <div class="section-actions">
        <button id="btn-layer-jw" class="chip small">Jw_cad の状態</button>
        <button id="btn-layer-all" class="chip small">すべて表示</button>
        <button id="btn-layer-invert-all" class="chip small">反転</button>
      </div>
    </div>
    <div id="layer-list" class="layer-list"></div>
  </div>
</div>

<div id="display-panel" class="overlay-panel sheet hidden">
  <div class="sheet-head">
    <strong>表示</strong>
    <button id="btn-display-close" class="chip">閉じる</button>
  </div>
  <div class="sheet-body">
    <div class="setting-row">
      <span class="setting-label">背景</span>
      <div id="seg-bg" class="segmented" role="group" aria-label="背景">
        <button data-value="dark">黒</button>
        <button data-value="light">白</button>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">線の色</span>
      <div id="seg-mono" class="segmented" role="group" aria-label="線の色">
        <button data-value="color">色分け</button>
        <button data-value="mono">単色</button>
      </div>
    </div>

    <div class="section-head">
      <div>
        <div class="section-title">色ごとの表示</div>
        <div id="color-summary" class="sub"></div>
      </div>
      <div class="section-actions">
        <button id="btn-color-all" class="chip small">すべて表示</button>
        <button id="btn-color-none" class="chip small">すべて隠す</button>
      </div>
    </div>
    <div id="color-list" class="color-list"></div>
  </div>
</div>

<div id="welcome" class="overlay-panel sheet">
  <div class="sheet-body welcome-body">
    <h1>JWW ビューア</h1>
    <p>Jw_cad の図面（.jww）をそのまま開いて、実寸で長さを測れます。</p>
    <button id="btn-open-2" class="primary">図面を開く</button>
    <ul class="tips">
      <li>1 本指でスクロール、2 本指で拡大縮小</li>
      <li>「計測」ではタップで計測点を置きます。長押しで拡大鏡、置いた点はつまんで動かせます</li>
      <li>「属性」では図形をタップすると、レイヤ・線色・線種・長さが分かります</li>
      <li>「レイヤ」でレイヤごとに表示を切り替えられます。最初は Jw_cad と同じ表示です</li>
    </ul>
  </div>
</div>

<input id="file" type="file" hidden>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
